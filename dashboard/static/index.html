<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>AI Company · Mission Control</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div id="login" class="login hidden">
    <form id="login-form" class="login-card">
      <div class="login-logo"><span class="logo-bean"></span></div>
      <h1>Mission Control</h1>
      <p class="muted">AI Company dashboard</p>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required autofocus>
      <button class="btn primary wide" type="submit">Board the ship</button>
      <p id="login-error" class="error-text"></p>
    </form>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand"><span class="logo-bean small"></span><span>AI Company</span></div>
      <nav id="nav">
        <button data-view="fleet" class="active"><span class="ico">🚀</span><span>Fleet</span><span id="nav-waiting" class="nav-badge hidden"></span></button>
        <button data-view="command"><span class="ico">💬</span><span>Orchestrator</span></button>
        <button data-view="studio"><span class="ico">🎨</span><span>Studio &amp; Files</span></button>
        <button data-view="overview"><span class="ico">◎</span><span>Overview</span></button>
        <button data-view="resources"><span class="ico">▣</span><span>Resources</span></button>
        <button data-view="log"><span class="ico">≡</span><span>Activity log</span></button>
        <button data-view="settings"><span class="ico">⚙</span><span>Settings</span></button>
      </nav>
      <div class="sidebar-foot">
        <button id="logout" class="btn ghost small wide">Log out</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menu-btn" class="icon-btn" aria-label="Open menu">☰</button>
        <h2 id="view-title">Fleet</h2>
        <div class="topbar-right">
          <span id="pill-jobs" class="pill hidden"></span>
          <span id="pill-waiting" class="pill warn hidden"></span>
          <span id="pill-runner" class="pill"></span>
          <div class="runner-controls">
            <button id="run-start" class="btn small success" title="Start the work loop" aria-label="Start">▶<span class="lbl"> Start</span></button>
            <button id="run-pause" class="btn small" title="Pause after the current task" aria-label="Pause">❚❚<span class="lbl"> Pause</span></button>
            <button id="run-step" class="btn small ghost" title="Run exactly one task" aria-label="Step">⏭<span class="lbl"> Step</span></button>
          </div>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>
    <div id="nav-backdrop" class="nav-backdrop"></div>
    <nav id="bottom-nav" class="bottom-nav" aria-label="Quick navigation">
      <button data-view="fleet"><span class="ico">🚀</span><span>Fleet</span><span id="bn-waiting" class="nav-badge hidden"></span></button>
      <button data-view="command"><span class="ico">💬</span><span>Chat</span></button>
      <button data-view="studio"><span class="ico">🎨</span><span>Studio</span></button>
      <button data-view="overview"><span class="ico">◎</span><span>Overview</span></button>
      <button id="bn-more"><span class="ico">⋯</span><span>Menu</span></button>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toasts" class="toasts"></div>
  <div id="emergency" class="emergency hidden"><div class="emergency-inner"><div class="emergency-title"></div><div class="emergency-text"></div></div></div>

  <script src="/static/ship.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
